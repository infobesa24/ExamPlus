<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to EXAMPLUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#faf7f1;
    --card:#ffffff;
    --ink:#1e2340;
    --ink-dim:#8a8778;
    --line:#ece5d6;

    --setup:#4c5fd5;      --setup-bg:#eaecfb;
    --students:#1f9e85;   --students-bg:#e2f5f1;
    --academics:#c8862a;  --academics-bg:#faf0dc;
    --results:#d85f36;    --results-bg:#fbe9e1;
    --finance:#2f9e52;    --finance-bg:#e3f5e9;
    --system:#6b7280;     --system-bg:#eef0f1;
    --account:#8b5cf6;    --account-bg:#f1ebfe;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(76,95,213,0.07), transparent);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none; color:inherit;}

  .wrap{max-width:1000px; margin:0 auto; padding:56px 20px 70px;}

  /* ---- hero ---- */
  .hero{text-align:center; margin-bottom:52px;}
  .hero .badge{
    width:64px; height:64px;
    margin:0 auto 20px;
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--setup), var(--account));
    color:#fff; font-size:26px;
    box-shadow:0 12px 28px rgba(76,95,213,0.25);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.1rem, 6vw, 3.1rem);
    margin:0;
    line-height:1.08;
  }
  h1 span{color:var(--setup);}

  /* ---- groups ---- */
  .group{margin-bottom:38px;}
  .group-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 16px 4px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:14px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 10px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation:rise .5s ease forwards;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 14px 26px rgba(30,35,64,0.09);
    border-color:transparent;
    outline:none;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .icon{
    width:52px; height:52px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    transition:transform .18s ease;
  }
  .card:hover .icon{transform:scale(1.06);}

  .card span.label{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    line-height:1.25;
  }

  /* category colors */
  .Setup     .icon{ background:var(--setup-bg);     color:var(--setup); }
  .Students  .icon{ background:var(--students-bg);  color:var(--students); }
  .Academics .icon{ background:var(--academics-bg); color:var(--academics); }
  .Results   .icon{ background:var(--results-bg);   color:var(--results); }
  .Finance   .icon{ background:var(--finance-bg);   color:var(--finance); }
  .System    .icon{ background:var(--system-bg);    color:var(--system); }
  .Account   .icon{ background:var(--account-bg);   color:var(--account); }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="badge"><i class="fa-solid fa-graduation-cap"></i></div>
    <h1>Welcome to <span>EXAMPLUS</span></h1>
  </div>

  <div id="groups"></div>

</div>

<script>
/* ============================================================
   PAGE CONFIG — edit to match the files in your repo.
   file:     relative path to the .html file
   title:    label shown under the icon
   icon:     Font Awesome class (fa-solid fa-...)
   category: groups pages under a header (also used for color)
   ============================================================ */
const PAGES = [
  { file: "school.html",           title: "School Profile",   icon: "fa-solid fa-school",              category: "Setup" },
  { file: "create-school.html",    title: "Create School",    icon: "fa-solid fa-square-plus",         category: "Setup" },
  { file: "view-schools.html",     title: "View Schools",     icon: "fa-solid fa-building-columns",    category: "Setup" },

  { file: "students.html",         title: "Students",         icon: "fa-solid fa-user-graduate",       category: "Students" },
  { file: "students-bulk.html",    title: "Bulk Students",    icon: "fa-solid fa-users",               category: "Students" },

  { file: "subjects.html",         title: "Subjects",         icon: "fa-solid fa-book",                category: "Academics" },

  { file: "upload-result.html",    title: "Upload Results",   icon: "fa-solid fa-upload",              category: "Results" },
  { file: "view-results.html",     title: "View Results",     icon: "fa-solid fa-chart-line",          category: "Results" },
  { file: "assessment.htm",        title: "Assessment",       icon: "fa-solid fa-clipboard-check",     category: "Results" },
  { file: "report.html",           title: "Report Cards",     icon: "fa-solid fa-file-lines",          category: "Results" },

  { file: "generate-receipt.html", title: "Generate Receipt", icon: "fa-solid fa-receipt",             category: "Finance" },
  { file: "receipt-history.html",  title: "Receipt History",  icon: "fa-solid fa-clock-rotate-left",   category: "Finance" },

  { file: "settings.html",         title: "Settings",         icon: "fa-solid fa-gear",                category: "System" },

  /* TODO: confirm the real filename for signup/activation */
  { file: "signup.html",           title: "Signup / Activate", icon: "fa-solid fa-user-plus",          category: "Account" }
];
/* ============================================================ */

const groupsEl = document.getElementById('groups');
const order = [...new Set(PAGES.map(p => p.category))];
let delay = 0;

groupsEl.innerHTML = order.map(cat => {
  const items = PAGES.filter(p => p.category === cat);
  const cards = items.map(p => {
    const d = (delay++ * 0.04).toFixed(2);
    return `
      <a class="card ${cat}" href="${p.file}" style="animation-delay:${d}s">
        <div class="icon"><i class="${p.icon}"></i></div>
        <span class="label">${p.title}</span>
      </a>`;
  }).join('');
  return `
    <div class="group">
      <div class="group-label">${cat}</div>
      <div class="grid">${cards}</div>
    </div>`;
}).join('');
</script>

</body>
</html>
